<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Jobs - Find Your Dream Remote Job</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap');
  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --bg: #f0f0f8;
    --card: #ffffff;
    --border: #d0d0e8;
    --text: #1a1a2e;
    --muted: #6b6b8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
  nav { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Manrope', sans-serif; font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
  .hero { background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460); padding: 5rem 2rem; text-align: center; border-radius: 0 0 40px 40px; }
  .hero h1 { font-family: 'Manrope', sans-serif; font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; color: #fff; margin-bottom: 1rem; }
  .hero h1 span { color: #e94560; }
  .hero p { color: rgba(255,255,255,0.8); font-size: 1.1rem; margin-bottom: 2rem; }
  .search-box { max-width: 600px; margin: 0 auto; display: flex; gap: 0.5rem; background: #fff; border-radius: 12px; padding: 0.4rem; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
  .search-box input { flex: 1; border: none; padding: 0.75rem 1rem; font-size: 1rem; outline: none; font-family: 'Inter', sans-serif; }
  .search-box button { background: linear-gradient(135deg, #e94560, #c73652); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
  .filters { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .filter-btn { padding: 0.5rem 1.2rem; border: 2px solid var(--border); border-radius: 50px; background: var(--card); color: var(--muted); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { border-color: #e94560; color: #e94560; background: rgba(233,69,96,0.08); }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; }
  .section-title { font-family: 'Manrope', sans-serif; font-size: 1.75rem; font-weight: 800; margin-bottom: 1.5rem; }
  .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; }
  .job-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: all 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .job-card:hover { border-color: #e94560; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(233,69,96,0.15); }
  .job-company { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.4rem; }
  .job-title { font-family: 'Manrope', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; line-height: 1.3; }
  .job-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .tag { padding: 0.25rem 0.65rem; background: #eaeaf8; border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
  .tag.remote { background: rgba(233,69,96,0.1); color: #e94560; }
  .loading { text-align: center; padding: 4rem; color: var(--muted); font-size: 1.1rem; }
  .spinner { width: 40px; height: 40px; border: 4px solid #eaeaf8; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { display: flex; gap: 2rem; justify-content: center; margin: 2rem 0; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-number { font-family: 'Manrope', sans-serif; font-size: 2rem; font-weight: 800; color: #e94560; }
  .stat-label { font-size: 0.8rem; color: var(--muted); }
  footer { background: linear-gradient(135deg, #1a1a2e, #16213e); color: rgba(255,255,255,0.8); text-align: center; padding: 2rem; font-size: 0.85rem; }
  @media(max-width: 600px) { .jobs-grid { grid-template-columns: 1fr; } .filters { gap: 0.5rem; } }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">Remote Jobs</a>
</nav>

<div class="hero">
  <h1>Find Your <span>Remote Job</span> Today</h1>
  <p>Thousands of real remote jobs from top companies worldwide</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search jobs, companies, skills..." />
    <button onclick="searchJobs()">Search</button>
  </div>
  <div class="stats" id="stats" style="margin-top:2rem"></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filterJobs('all', this)">All Jobs</button>
  <button class="filter-btn" onclick="filterJobs('remote', this)">Remote Only</button>
  <button class="filter-btn" onclick="filterJobs('engineering', this)">Engineering</button>
  <button class="filter-btn" onclick="filterJobs('marketing', this)">Marketing</button>
  <button class="filter-btn" onclick="filterJobs('design', this)">Design</button>
  <button class="filter-btn" onclick="filterJobs('sales', this)">Sales</button>
  <button class="filter-btn" onclick="filterJobs('support', this)">Support</button>
  <button class="filter-btn" onclick="filterJobs('finance', this)">Finance</button>
</div>

<div class="container">
  <div class="section-title">Latest Jobs</div>
  <div class="jobs-grid" id="jobsGrid">
    <div class="loading">
      <div class="spinner"></div>
      Loading real jobs...
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Remote Jobs. Real jobs from real companies worldwide.</p>
</footer>

<script>
let allJobs = [];
let currentFilter = 'all';
let searchQuery = '';

async function fetchJobs() {
  try {
    // Fetch from Remotive API (free, no key needed)
    const response = await fetch('/api/jobs');
    const data = await response.json();
    allJobs = data.jobs || [];
    updateStats();
    renderJobs();
  } catch (err) {
    // Fallback to Arbeitnow API
    try {
      const response = await fetch('https://www.arbeitnow.com/api/job-board-api');
      const data = await response.json();
      allJobs = (data.data || []).map(job => ({
        title: job.title,
        company_name: job.company,
        category: job.tags?.[0] || 'General',
        candidate_required_location: job.location || 'Remote',
        job_type: job.remote ? 'full_time' : 'full_time',
        url: job.url,
        description: job.description,
        tags: job.tags || [],
        publication_date: job.created_at
      }));
      updateStats();
      renderJobs();
    } catch (err2) {
      document.getElementById('jobsGrid').innerHTML = '<div class="loading">Could not load jobs. Please try again.</div>';
    }
  }
}

function updateStats() {
  const remote = allJobs.filter(j => j.candidate_required_location?.toLowerCase().includes('remote') || j.job_type?.includes('remote')).length;
  const companies = [...new Set(allJobs.map(j => j.company_name))].length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-number">${allJobs.length}+</div><div class="stat-label">Live Jobs</div></div>
    <div class="stat"><div class="stat-number">${companies}+</div><div class="stat-label">Companies</div></div>
    <div class="stat"><div class="stat-number">${remote}+</div><div class="stat-label">Remote Jobs</div></div>
  `;
}

function filterJobs(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderJobs();
}

function searchJobs() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  renderJobs();
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchJobs();
});

function renderJobs() {
  let jobs = allJobs;

  if (searchQuery) {
    jobs = jobs.filter(j =>
      j.title?.toLowerCase().includes(searchQuery) ||
      j.company_name?.toLowerCase().includes(searchQuery) ||
      j.category?.toLowerCase().includes(searchQuery)
    );
  }

  if (currentFilter !== 'all') {
    if (currentFilter === 'remote') {
      jobs = jobs.filter(j =>
        j.candidate_required_location?.toLowerCase().includes('remote') ||
        j.job_type?.includes('remote')
      );
    } else {
      jobs = jobs.filter(j =>
        j.category?.toLowerCase().includes(currentFilter) ||
        j.title?.toLowerCase().includes(currentFilter)
      );
    }
  }

  if (jobs.length === 0) {
    document.getElementById('jobsGrid').innerHTML = '<div class="loading">No jobs found. Try a different search.</div>';
    return;
  }

  document.getElementById('jobsGrid').innerHTML = jobs.map(job => `
    <a class="job-card" href="job.html?id=${encodeURIComponent(job.id || job.title)}&url=${encodeURIComponent(job.url)}" 
       onclick="saveJob(${JSON.stringify(job).replace(/"/g, '&quot;')})">
      <div class="job-company">${job.company_name || 'Company'}</div>
      <div class="job-title">${job.title}</div>
      <div class="job-tags">
        ${job.candidate_required_location?.toLowerCase().includes('remote') ? '<span class="tag remote">Remote</span>' : ''}
        <span class="tag">${job.category || 'General'}</span>
        ${job.job_type ? `<span class="tag">${job.job_type.replace('_', ' ')}</span>` : ''}
      </div>
    </a>
  `).join('');
}

function saveJob(job) {
  localStorage.setItem('currentJob', JSON.stringify(job));
}

fetchJobs();
</script>
</body>
</html>
